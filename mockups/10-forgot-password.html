<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TechieBlog 2.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="layout">
        <!-- Header -->
        <header class="header">
            <a href="01-home.html" class="header__logo">
                <span>TechieBlog</span>
            </a>
            <nav class="header__nav">
                <a href="01-home.html" class="header__nav-link">Home</a>
                <a href="03-category-archive.html" class="header__nav-link">Categories</a>
                <a href="05-series-view.html" class="header__nav-link">Series</a>
                <a href="06-search-results.html" class="header__nav-link">Search</a>
            </nav>
            <div class="header__actions">
                <!-- Theme Toggle -->
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">
                    <svg class="theme-toggle__moon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                    </svg>
                    <svg class="theme-toggle__sun" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
                    </svg>
                </button>
                <button class="btn btn--icon show-mobile" title="Menu">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M2 4.5a.5.5 0 01.5-.5h15a.5.5 0 010 1h-15a.5.5 0 01-.5-.5zm0 5a.5.5 0 01.5-.5h15a.5.5 0 010 1h-15a.5.5 0 01-.5-.5zm.5 4.5a.5.5 0 000 1h15a.5.5 0 000-1h-15z"/>
                    </svg>
                </button>
                <a href="08-login.html" class="btn btn--secondary hide-mobile">Login</a>
                <a href="09-register.html" class="btn btn--primary hide-mobile">Sign Up</a>
            </div>
        </header>

        <!-- Main Content -->
        <div class="auth-page">
            <div class="auth-card">
                <h1 class="auth-card__title">Forgot Password?</h1>

                <p style="text-align: center; color: var(--color-neutral-light); margin-bottom: var(--spacing-lg);">
                    Enter your email address and we'll send you a link to reset your password.
                </p>

                <form>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                    </div>

                    <button type="submit" class="btn btn--primary" style="width: 100%; margin-top: var(--spacing-md);">
                        Send Reset Link
                    </button>
                </form>

                <div class="auth-card__footer">
                    Remember your password? <a href="08-login.html">Sign in</a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2025 TechieBlog. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // Theme Toggle Functionality
        function toggleTheme() {
            const root = document.documentElement;
            const currentTheme = root.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        // Initialize theme from localStorage or system preference
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</body>
</html>
