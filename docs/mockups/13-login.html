<!DOCTYPE html>
<!-- ============================================================
  Screen: Sign in  ·  Route: /login
  Roles: anonymous (direct URL only)  ·  BRD: BRD-2, BRD-93  ·  REQ: REQ-UI-001
  Component map (region → TrBlazeUI control):
    Brand mark       → Typography link (→ 01-home.html); NO site nav on auth pages
    Sign-in card     → TbCard (max-width 420px, centered)
    Email / password → TbInput + TbLabel
    Remember me      → TbCheckbox · Forgot link → 15-forgot-password.html
    Submit           → TbButton (primary, full-width)
    Error state      → TbAlert (destructive) — commented variant below
    Theme toggle     → TbButton (ghost icon, fixed top-right)
  States: default (empty form); invalid credentials → TbAlert destructive;
          submitting → TbButton disabled + TbSpinner.
============================================================ -->
<!-- NOTE: /login is reached by DIRECT URL only — no public link to it exists anywhere on the site (BRD-93). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · TechieBlog</title>
<link rel="stylesheet" href="trblazeui.css">
</head>
<body>

<button class="btn btn-ghost btn-icon" style="position:fixed;top:16px;right:16px;z-index:50" onclick="document.documentElement.classList.toggle('dark')" title="Toggle dark mode">
  <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
</button>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">

  <a href="01-home.html" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:20px">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--primary);display:inline-block"></span> TechieBlog
  </a>

  <div class="card" style="width:100%;max-width:420px">
    <div class="card-header">
      <div class="card-title" style="font-size:18px">Sign in</div>
      <div class="card-desc">Welcome back — enter your account details.</div>
    </div>
    <div class="card-content">

      <!-- TbAlert (destructive) — shown on failed sign-in:
      <div class="alert alert-destructive" style="margin-bottom:16px">
        <span>⚠</span><div>Invalid email or password.</div>
      </div>
      -->

      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" value="ravi@techieblog.dev">
      </div>

      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" id="password" type="password" placeholder="••••••••">
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:13.5px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <span class="checkbox checked"></span> Remember me
        </label>
        <a href="15-forgot-password.html" style="color:var(--primary)">Forgot password?</a>
      </div>

      <!-- successful sign-in lands in the admin area -->
      <a class="btn btn-primary" style="width:100%" href="26-admin-dashboard.html">Sign in</a>

      <!-- No reader sign-up: comments and ratings are anonymous (email only). /login is for the admin area. -->
      <p class="hint muted" style="text-align:center;margin-top:16px">
        Admin access only — reader accounts are not required to comment or rate.
      </p>
    </div>
  </div>

</div>

</body>
</html>
