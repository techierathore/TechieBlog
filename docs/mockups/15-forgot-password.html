<!DOCTYPE html>
<!-- ============================================================
  Screen: Forgot password  ·  Route: /forgot-password
  Roles: anonymous (direct URL only)  ·  BRD: BRD-4, BRD-93  ·  REQ: REQ-UI-003
  Component map (region → TrBlazeUI control):
    Brand mark      → Typography link (→ 01-home.html); NO site nav on auth pages
    Request card    → TbCard (max-width 420px, centered)
    Email           → TbInput + TbLabel
    Submit          → TbButton (primary, full-width)
    Success notice  → TbAlert (info) — shown after submit (rendered below as sample state)
    Theme toggle    → TbButton (ghost icon, fixed top-right)
  States: default (form); submitted → success TbAlert (same message whether or not the
          address exists — no account enumeration); submitting → TbButton disabled.
============================================================ -->
<!-- NOTE: /forgot-password is reached by DIRECT URL only (via the /login card) — no public link exists (BRD-93). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password · TechieBlog</title>
<link rel="stylesheet" href="trblazeui.css">
</head>
<body>

<button class="btn btn-ghost btn-icon" style="position:fixed;top:16px;right:16px;z-index:50" onclick="document.documentElement.classList.toggle('dark')" title="Toggle dark mode">🌓</button>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">

  <a href="01-home.html" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:20px">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--primary);display:inline-block"></span> TechieBlog
  </a>

  <div class="card" style="width:100%;max-width:420px">
    <div class="card-header">
      <div class="card-title" style="font-size:18px">Forgot password</div>
      <div class="card-desc">Enter your account email and we'll send you a link to reset your password.</div>
    </div>
    <div class="card-content">

      <!-- TbAlert (info) — success state after submit -->
      <div class="alert alert-info" style="margin-bottom:16px">
        <span>✉</span><div>If the address exists, a reset link has been sent.</div>
      </div>

      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" placeholder="you@example.com" value="deepak@example.com">
      </div>

      <button class="btn btn-primary" style="width:100%">Send reset link</button>

      <p class="hint" style="text-align:center;margin-top:16px">
        <a href="13-login.html" style="color:var(--primary)">← Back to sign in</a>
      </p>
    </div>
  </div>

</div>

</body>
</html>
