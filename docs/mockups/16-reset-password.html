<!DOCTYPE html>
<!-- ============================================================
  Screen: Reset password  ·  Route: /reset-password/{token}
  Roles: anonymous (direct URL only — link arrives by email)  ·  BRD: BRD-5, BRD-93  ·  REQ: REQ-UI-003
  Component map (region → TrBlazeUI control):
    Brand mark       → Typography link (→ 01-home.html); NO site nav on auth pages
    Reset card       → TbCard (max-width 420px, centered)
    New / confirm    → TbInput + TbLabel (+ strength hint)
    Submit           → TbButton (primary, full-width)
    Token error      → TbAlert (destructive) — commented variant below
    Theme toggle     → TbButton (ghost icon, fixed top-right)
  States: default (valid token, empty form); invalid/expired token → TbAlert destructive
          + form hidden, link back to /forgot-password; success → redirect to /login with toast.
============================================================ -->
<!-- NOTE: /reset-password/{token} is reached by DIRECT URL only (from the reset email) — no public link exists (BRD-93). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · TechieBlog</title>
<link rel="stylesheet" href="trblazeui.css">
</head>
<body>

<button class="btn btn-ghost btn-icon" style="position:fixed;top:16px;right:16px;z-index:50" onclick="document.documentElement.classList.toggle('dark')" title="Toggle dark mode">🌓</button>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">

  <a href="01-home.html" style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:20px">
    <span style="width:10px;height:10px;border-radius:50%;background:var(--primary);display:inline-block"></span> TechieBlog
  </a>

  <div class="card" style="width:100%;max-width:420px">
    <div class="card-header">
      <div class="card-title" style="font-size:18px">Reset password</div>
      <div class="card-desc">Choose a new password for <b>deepak@example.com</b>.</div>
    </div>
    <div class="card-content">

      <!-- TbAlert (destructive) — invalid or expired token state (form is hidden when shown):
      <div class="alert alert-destructive" style="margin-bottom:16px">
        <span>⚠</span><div>This reset link is invalid or has expired.
        <a href="15-forgot-password.html" style="color:var(--primary)">Request a new one</a>.</div>
      </div>
      -->

      <div class="field">
        <label class="label" for="newPassword">New password</label>
        <input class="input" id="newPassword" type="password" placeholder="••••••••">
        <span class="hint">Min 8 characters, with upper &amp; lower case and at least one number.</span>
      </div>

      <div class="field">
        <label class="label" for="confirm">Confirm new password</label>
        <input class="input" id="confirm" type="password" placeholder="••••••••">
      </div>

      <button class="btn btn-primary" style="width:100%">Reset password</button>

      <p class="hint" style="text-align:center;margin-top:16px">
        <a href="13-login.html" style="color:var(--primary)">← Back to sign in</a>
      </p>
    </div>
  </div>

</div>

</body>
</html>
