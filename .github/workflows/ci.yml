# TechieBlog CI — REQ-NFR-017 (BRD-77)
#
# Builds the solution, runs TechieBlog.Tests with coverage, and publishes the
# web host as a downloadable artifact, on every push to main/dev and every PR.
#
# ---------------------------------------------------------------------------
# NuGet authentication
# ---------------------------------------------------------------------------
# The build needs the private GitHub Packages feed that hosts TrBlazeUI. The
# nuget.config committed at the repo root deliberately carries NO credentials
# (REQ-NFR-025 — a PAT was committed there until 2026-08-09 and was invalidated
# by GitHub secret scanning). This workflow therefore writes a throwaway
# nuget.ci.config at run time from a repository secret and passes it with
# --configfile.
#
# Step-by-step setup is in GETTING_STARTED.md, section
# "NuGet feed access". Short version below.
#
# Token precedence:
#   1. secrets.TrBlazeUiPackagesToken — a PAT with read:packages, required when
#      the TrBlazeUI package lives outside this repository's package scope.
#   2. secrets.GITHUB_TOKEN — works only when the package is published from, or
#      explicitly grants access to, this repository.
#
# Add the PAT under Settings -> Secrets and variables -> Actions ->
# New repository secret, named exactly TrBlazeUiPackagesToken.
#
# 2026-08-09 (REQ-NFR-017): restore failed with NU1301 / 403 Forbidden because
# TrBlazeUiPackagesToken was not configured and the GITHUB_TOKEN fallback cannot
# read a user-scoped GitHub Packages feed unless the package explicitly grants
# this repository access. The failure surfaced as ~60 lines of NuGet retry noise
# that never named the real cause, so a preflight probe now runs BEFORE restore
# and fails with one actionable message instead.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  Configuration: Release

jobs:
  build-test-artifacts:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Write CI NuGet config
        env:
          PatToken: ${{ secrets.TrBlazeUiPackagesToken }}
          FallbackToken: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$PatToken" ]; then
            PackagesToken="$PatToken"
            echo "Using TrBlazeUiPackagesToken (dedicated PAT)."
          else
            PackagesToken="$FallbackToken"
            echo "::warning::TrBlazeUiPackagesToken is not set; falling back to GITHUB_TOKEN." \
                 "This works only if the TrBlazeUI packages explicitly grant this repository read access."
          fi

          cat > nuget.ci.config <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="TrBlazeUI" value="https://nuget.pkg.github.com/techierathore/index.json" />
            </packageSources>
          </configuration>
          XML
          dotnet nuget update source TrBlazeUI \
            --configfile nuget.ci.config \
            --username techierathore \
            --password "$PackagesToken" \
            --store-password-in-clear-text

      # Restore emits ~60 lines of retry noise and an NU1301 that never names the
      # real cause. Probe the package base address directly first so a credential
      # problem fails in one line with the exact remedy. (REQ-NFR-017)
      - name: Preflight — TrBlazeUI feed authentication
        env:
          PatToken: ${{ secrets.TrBlazeUiPackagesToken }}
          FallbackToken: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PackagesToken="${PatToken:-$FallbackToken}"
          probe="https://nuget.pkg.github.com/techierathore/download/trblazeui.components/index.json"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "techierathore:$PackagesToken" "$probe")

          if [ "$code" = "200" ]; then
            echo "TrBlazeUI feed reachable and authenticated (HTTP 200)."
            exit 0
          fi

          cat >&2 <<MSG
          ============================================================================
          Cannot read the private TrBlazeUI GitHub Packages feed (HTTP $code).

          The build needs TrBlazeUI.Components and TrBlazeUI.Icons.Lucide, which live
          on a private user-scoped feed. Without a token carrying the read:packages
          scope, restore fails later with NU1301 / 403 Forbidden.

          To fix, do ONE of:

            1. Create a classic PAT with the read:packages scope, then add it at
               Settings -> Secrets and variables -> Actions -> New repository secret
               named exactly:  TrBlazeUiPackagesToken

            2. Or, on each TrBlazeUI package page under
               github.com/users/techierathore/packages , open Package settings ->
               Manage Actions access and grant this repository Read access. The
               built-in GITHUB_TOKEN then suffices and no secret is needed.

          Note: the token previously committed in nuget.config was invalidated by
          GitHub secret scanning and cannot be reused. (REQ-NFR-025)
          ============================================================================
          MSG
          exit 1

      - name: Restore
        run: dotnet restore TechieBlog.slnx --configfile nuget.ci.config

      - name: Build
        run: dotnet build TechieBlog.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test tests/TechieBlog.Tests/TechieBlog.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=TechieBlog.Tests.trx" \
            --results-directory artifacts/test-results \
            --collect:"XPlat Code Coverage" \
            --settings tests/TechieBlog.Tests/coverlet.runsettings

      # BlogEngine line-coverage target is 80% (BRD-76), measured against the DELIBERATELY
      # NARROWED scope declared in tests/TechieBlog.Tests/coverlet.runsettings — read that
      # file's comment block before quoting this number anywhere. It is NOT whole-assembly
      # coverage (that figure is 51.6%).
      #
      # ENFORCING since 2026-08-10 (REQ-NFR-016, cluster F). It was report-only while the
      # sibling suites were landing and the measured figure sat under target. It now measures
      # 82.5% (5,002/6,065 lines, 1,291 tests), which is clear enough of 80% that the gate
      # trips on a real regression rather than on a one-line change — the knife-edge case that
      # gets a gate switched off again.
      - name: Report BlogEngine coverage
        if: always()
        run: |
          report=$(find artifacts/test-results -name 'coverage.cobertura.xml' | head -n 1)
          if [ -z "$report" ]; then
            echo "No coverage report produced."
            exit 0
          fi
          rate=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' "$report" | head -n 1)
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          echo "BlogEngine line coverage: ${pct}% (target 80%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v r="$rate" 'BEGIN { exit (r < 0.80) ? 0 : 1 }'; then
            echo "::error::BlogEngine coverage ${pct}% is below the 80% REQ-NFR-016 target"
            exit 1
          fi

      - name: Publish web host
        run: |
          dotnet publish source/TechieBlog/TechieBlog.csproj \
            --configuration Release \
            --no-build \
            --output artifacts/site

      - name: Upload web host artifact
        uses: actions/upload-artifact@v4
        with:
          name: techieblog-site-${{ github.sha }}
          path: artifacts/site
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: techieblog-test-results-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14
